name: Deploy to Staging

on:
  push:
    branches: [staging]

# Same group as deploy.yml, deliberately — see that file for why. This is
# what actually enforces "never run alongside a production deploy."
concurrency:
  group: crm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          # Unlike production, staging DOES auto-apply schema changes
          # (prisma db push) — that's the whole point of testing there first.
          # The staging DB holds throwaway data, so destructive changes are fine.
          script: |
            set -e
            cd ~/staging
            git fetch origin staging
            git reset --hard origin/staging
            npm install
            export $(grep '^DATABASE_URL=' .env.local)
            npx prisma db push --accept-data-loss
            NODE_OPTIONS='--max-old-space-size=1536' npm run build
            pm2 restart crm-staging
